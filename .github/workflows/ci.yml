name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run untrusted code, so the token only gets read access.
permissions:
  contents: read

# requires-python has no upper bound, so uv would otherwise pick the newest Python,
# for which some dependencies have no wheels yet.
env:
  UV_PYTHON: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest
